<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Quest - Aprenda Git e GitHub!</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #0d1117, #161b22, #21262d); min-height: 100vh; color: #fff; overflow-x: hidden; }
header { background: rgba(255,255,255,0.05); padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
.logo { font-size: 1.8rem; font-weight: 800; color: #f78166; }
.xp-bar-container { display: flex; align-items: center; gap: 10px; }
.xp-label { font-size: 0.85rem; color: #f78166; font-weight: 700; }
.xp-bar { width: 180px; height: 12px; background: rgba(255,255,255,0.15); border-radius: 10px; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, #f78166, #ff9a3c); border-radius: 10px; transition: width 0.5s ease; width: 0%; }
.xp-text { font-size: 0.8rem; color: #ccc; }
.nivel { background: #f78166; color: #000; font-weight: 800; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; }
.hero { text-align: center; padding: 60px 20px 40px; }
.hero h1 { font-size: 3rem; font-weight: 900; line-height: 1.2; margin-bottom: 15px; }
.hero h1 span { color: #f78166; }
.hero p { font-size: 1.1rem; color: #bbb; max-width: 500px; margin: 0 auto 30px; line-height: 1.6; }
.btn-start { background: #f78166; color: #000; font-weight: 800; font-size: 1.1rem; padding: 15px 40px; border-radius: 50px; border: none; cursor: pointer; }
.progress-section { max-width: 800px; margin: 0 auto 20px; padding: 0 20px; text-align: center; }
.progress-section p { font-size: 0.9rem; color: #999; margin-bottom: 8px; }
.progress-bar-big { height: 16px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; }
.progress-fill-big { height: 100%; background: linear-gradient(90deg, #f78166, #ff9a3c); border-radius: 10px; transition: width 0.7s ease; width: 0%; }
.trail-section { padding: 20px 20px 40px; max-width: 800px; margin: 0 auto; }
.trail-section h2 { text-align: center; font-size: 1.5rem; margin-bottom: 30px; color: #f78166; }
.trail { display: flex; flex-direction: column; gap: 15px; }
.lesson-card { display: flex; align-items: center; gap: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.3s ease; }
.lesson-card:hover { background: rgba(255,255,255,0.1); transform: translateX(5px); border-color: rgba(247,129,102,0.5); }
.lesson-card.locked { opacity: 0.5; cursor: not-allowed; }
.lesson-card.locked:hover { transform: none; }
.lesson-card.completed { border-color: rgba(100,255,100,0.4); background: rgba(100,255,100,0.05); }
.lesson-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; flex-shrink: 0; background: rgba(247,129,102,0.15); border: 2px solid rgba(247,129,102,0.4); color: #f78166; }
.lesson-info h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
.lesson-info p { font-size: 0.85rem; color: #999; }
.lesson-badge { margin-left: auto; font-size: 0.75rem; padding: 4px 12px; border-radius: 20px; font-weight: 700; flex-shrink: 0; }
.badge-free { background: rgba(247,129,102,0.2); color: #f78166; }
.badge-done { background: rgba(100,255,100,0.2); color: #90ff90; }
.badge-locked { background: rgba(255,255,255,0.05); color: #666; }
.achievements-section { padding: 20px 20px 60px; max-width: 800px; margin: 0 auto; }
.achievements-section h2 { text-align: center; font-size: 1.4rem; color: #f78166; margin-bottom: 20px; }
.achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.achievement { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px 10px; text-align: center; }
.achievement.unlocked { background: rgba(247,129,102,0.1); border-color: rgba(247,129,102,0.4); }
.achievement .ach-icon { font-size: 2rem; margin-bottom: 8px; filter: grayscale(1); }
.achievement.unlocked .ach-icon { filter: none; }
.achievement .ach-name { font-size: 0.8rem; color: #777; }
.achievement.unlocked .ach-name { color: #f78166; font-weight: 700; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
.modal-overlay.active { display: flex; }
.modal { background: #0d1117; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; width: 100%; max-width: 720px; max-height: 90vh; overflow-y: auto; padding: 30px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
.modal-header h2 { font-size: 1.4rem; color: #f78166; }
.btn-close { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1rem; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.tab { padding: 10px 18px; border: none; background: transparent; color: #999; font-size: 0.9rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: #f78166; border-bottom-color: #f78166; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.lesson-content p { line-height: 1.7; color: #ccc; margin-bottom: 15px; font-size: 0.95rem; }
.lesson-content h3 { color: #f78166; margin: 20px 0 10px; font-size: 1.05rem; }
.tip-box { background: rgba(247,129,102,0.08); border-left: 3px solid #f78166; border-radius: 8px; padding: 14px 18px; margin: 15px 0; font-size: 0.9rem; color: #ddd; font-family: monospace; line-height: 1.8; white-space: pre-wrap; }
.terminal { width: 100%; min-height: 180px; background: #0a0a0a; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 14px; font-family: monospace; font-size: 0.85rem; overflow-y: auto; color: #90ff90; line-height: 1.8; }
.terminal .cmd { color: #f78166; display: block; }
.terminal .out { color: #ccc; display: block; }
.terminal .err { color: #ff9090; display: block; }
.terminal .info { color: #90cfff; display: block; }
.terminal-input-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.terminal-prompt { color: #f78166; font-family: monospace; font-size: 0.9rem; }
.terminal-input { flex: 1; background: #0a0a0a; border: 1px solid rgba(247,129,102,0.4); border-radius: 8px; color: #90ff90; font-family: monospace; font-size: 0.9rem; padding: 8px 12px; outline: none; }
.btn-run { margin-top: 12px; background: #f78166; color: #000; font-weight: 800; padding: 10px 28px; border-radius: 30px; border: none; cursor: pointer; font-size: 0.9rem; margin-right: 8px; }
.btn-clear { margin-top: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #ccc; padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 0.9rem; }
.cmds-lista { margin-top: 15px; padding: 12px; background: rgba(247,129,102,0.08); border-radius: 8px; border-left: 3px solid #f78166; }
.cmds-lista p { color: #f78166; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
.cmds-lista span { color: #ccc; font-family: monospace; font-size: 0.85rem; display: block; margin: 2px 0; }
.quiz-question { font-size: 1.05rem; font-weight: 700; margin-bottom: 20px; color: #fff; line-height: 1.5; }
.quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.quiz-option { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 18px; cursor: pointer; font-size: 0.95rem; color: #ccc; text-align: left; width: 100%; }
.quiz-option:hover:not(:disabled) { border-color: rgba(247,129,102,0.5); background: rgba(247,129,102,0.08); color: #fff; }
.quiz-option.correct { border-color: rgba(100,255,100,0.7); background: rgba(100,255,100,0.1); color: #90ff90; }
.quiz-option.wrong { border-color: rgba(255,80,80,0.7); background: rgba(255,80,80,0.1); color: #ff9090; }
.quiz-feedback { padding: 14px 18px; border-radius: 12px; font-size: 0.95rem; margin-bottom: 15px; display: none; }
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: rgba(100,255,100,0.1); border: 1px solid rgba(100,255,100,0.3); color: #90ff90; }
.quiz-feedback.err { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.3); color: #ff9090; }
.btn-next-quiz { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 10px 24px; border-radius: 30px; cursor: pointer; font-size: 0.9rem; display: none; }
.btn-next-quiz.show { display: inline-block; }
.toast { position: fixed; bottom: 30px; right: 30px; background: #f78166; color: #000; font-weight: 800; padding: 14px 24px; border-radius: 50px; z-index: 9999; font-size: 0.95rem; transform: translateY(100px); opacity: 0; transition: all 0.4s ease; pointer-events: none; }
.toast.show { transform: translateY(0); opacity: 1; }
@media (max-width: 600px) { .hero h1 { font-size: 2rem; } .xp-bar { width: 100px; } }
</style>
</head>
<body>

<header>
  <div class="logo">Git Quest</div>
  <div class="xp-bar-container">
    <span class="nivel" id="nivelLabel">Nivel 1</span>
    <div>
      <div class="xp-label">XP</div>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
    </div>
    <span class="xp-text" id="xpText">0 / 100</span>
  </div>
</header>

<section class="hero">
  <h1>Aprenda <span>Git e GitHub</span><br>de verdade!</h1>
  <p>Salve, compartilhe e colabore em projetos como um desenvolvedor profissional.</p>
  <button class="btn-start" onclick="document.getElementById('trilha').scrollIntoView({behavior:'smooth'})">Comecar Agora</button>
</section>

<div class="progress-section">
  <p id="progressText">0 de 5 aulas concluidas</p>
  <div class="progress-bar-big"><div class="progress-fill-big" id="progressFill"></div></div>
</div>

<section class="trail-section" id="trilha">
  <h2>Trilha de Aprendizado</h2>
  <div class="trail" id="trailContainer"></div>
</section>

<section class="achievements-section">
  <h2>Conquistas</h2>
  <div class="achievements-grid" id="achievementsGrid"></div>
</section>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="btn-close" onclick="fecharModal()">X</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('teoria',this)">Teoria</button>
      <button class="tab" onclick="switchTab('pratica',this)">Terminal</button>
      <button class="tab" onclick="switchTab('quiz',this)">Quiz</button>
    </div>
    <div class="tab-content active" id="tab-teoria"></div>
    <div class="tab-content" id="tab-pratica"></div>
    <div class="tab-content" id="tab-quiz"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var LS = [
  {
    id:0, title:"O que e Git?", desc:"Entenda o controle de versao", xp:20,
    teoria:[
      "Git e um sistema de controle de versao. Ele salva o historico de tudo que voce faz no projeto, como um checkpoint em um videogame.",
      "Com Git voce pode voltar para qualquer versao anterior do codigo, trabalhar em equipe sem baguncar o projeto e ver quem alterou o que e quando.",
      "GitHub e um site que armazena seus projetos Git na nuvem. Git e a ferramenta instalada no computador. GitHub e o lugar onde voce guarda e compartilha.",
      "Para usar Git voce instala no computador e usa comandos no terminal. Todos os comandos comecam com a palavra git."
    ],
    cmds:["git --version","git config --global user.name SeuNome","git config --global user.email seu@email.com"],
    resp:["git version 2.40.0","Nome configurado com sucesso!","Email configurado com sucesso!"],
    quiz:[
      {q:"O que e Git?",opts:["Um site para fotos","Um sistema de controle de versao","Um editor de codigo","Uma linguagem"],c:1,ok:"Certo! Git e um sistema de controle de versao.",err:"Errado. Git e um sistema de controle de versao."},
      {q:"Qual a diferenca entre Git e GitHub?",opts:["Sao a mesma coisa","Git e o site","Git e a ferramenta, GitHub e o site","Nenhuma"],c:2,ok:"Certo! Git e a ferramenta e GitHub e o site.",err:"Errado. Git e a ferramenta local e GitHub e o site na nuvem."}
    ]
  },
  {
    id:1, title:"Primeiro repositorio", desc:"git init, add e commit", xp:25,
    teoria:[
      "Um repositorio e a pasta do projeto sendo monitorada pelo Git. Para criar um use git init dentro da pasta.",
      "Depois de criar ou editar arquivos voce precisa avisar o Git quais quer salvar. Use git add nome-do-arquivo ou git add . para adicionar tudo.",
      "O commit e o momento em que voce salva oficialmente as mudancas com uma mensagem explicando o que fez. Use git commit -m 'sua mensagem aqui'.",
      "O fluxo basico sempre e o mesmo: editar o arquivo, git add, git commit. Repita isso sempre que fizer algo importante."
    ],
    cmds:["git init","git add .","git commit -m 'primeiro commit'","git status"],
    resp:[
      "Initialized empty Git repository in /projeto/.git/",
      "Arquivos adicionados a area de preparacao.",
      "[main (root-commit)] primeiro commit - 1 file changed",
      "On branch main - nothing to commit, working tree clean"
    ],
    quiz:[
      {q:"O que faz o comando git init?",opts:["Envia o projeto para o GitHub","Cria um repositorio Git na pasta atual","Baixa um projeto","Apaga o historico"],c:1,ok:"Certo! git init cria o repositorio na pasta.",err:"Errado. git init cria o repositorio Git na pasta atual."},
      {q:"Qual comando salva as mudancas com uma mensagem?",opts:["git add","git push","git commit -m","git init"],c:2,ok:"Certo! git commit -m salva com mensagem.",err:"Errado. O comando correto e git commit -m 'mensagem'."}
    ]
  },
  {
    id:2, title:"Conectando ao GitHub", desc:"remote, push e pull", xp:30,
    teoria:[
      "Depois de criar um repositorio no GitHub, voce conecta sua pasta local a ele com o comando git remote add origin URL.",
      "Para enviar seus commits ao GitHub use git push origin main. Isso manda tudo que voce commitou para a nuvem.",
      "Para baixar atualizacoes do GitHub para sua maquina use git pull origin main. Util quando outra pessoa fez mudancas no projeto.",
      "Sempre que comecar a trabalhar num projeto compartilhado, faca git pull primeiro para garantir que tem a versao mais recente."
    ],
    cmds:["git remote add origin https://github.com/usuario/repo.git","git push origin main","git pull origin main","git remote -v"],
    resp:[
      "Repositorio remoto adicionado com sucesso.",
      "Branch main configurada. Arquivos enviados ao GitHub!",
      "Already up to date.",
      "origin  https://github.com/usuario/repo.git (fetch+push)"
    ],
    quiz:[
      {q:"O que faz o git push?",opts:["Baixa arquivos do GitHub","Cria uma branch","Envia commits ao GitHub","Apaga o repositorio"],c:2,ok:"Certo! git push envia seus commits para o GitHub.",err:"Errado. git push envia os commits locais para o repositorio remoto."},
      {q:"Qual comando baixa atualizacoes do GitHub?",opts:["git push","git clone","git pull","git fetch"],c:2,ok:"Certo! git pull baixa e integra as mudancas remotas.",err:"Errado. O comando correto e git pull."}
    ]
  },
  {
    id:3, title:"Branches", desc:"Trabalhando em paralelo", xp:35,
    teoria:[
      "Branch e uma ramificacao do projeto. Voce cria uma branch para desenvolver uma funcionalidade nova sem mexer no codigo principal.",
      "Para criar uma branch use git branch nome-da-branch. Para mudar para ela use git checkout nome-da-branch. Ou faca os dois de uma vez com git checkout -b nome.",
      "Quando terminar o trabalho na branch voce a une de volta a branch principal com git merge nome-da-branch.",
      "A branch principal geralmente se chama main ou master. E uma boa pratica nunca desenvolver diretamente nela."
    ],
    cmds:["git branch nova-funcionalidade","git checkout nova-funcionalidade","git checkout -b outra-branch","git merge nova-funcionalidade"],
    resp:[
      "Branch nova-funcionalidade criada.",
      "Switched to branch 'nova-funcionalidade'",
      "Switched to a new branch 'outra-branch'",
      "Merge feito com sucesso. Fast-forward."
    ],
    quiz:[
      {q:"Para que serve uma branch?",opts:["Apagar commits antigos","Trabalhar em paralelo sem afetar o codigo principal","Conectar ao GitHub","Configurar o usuario"],c:1,ok:"Certo! Branches permitem trabalho paralelo e seguro.",err:"Errado. Branches servem para trabalhar em paralelo sem afetar o codigo principal."},
      {q:"Qual comando cria e ja muda para uma nova branch?",opts:["git branch","git merge","git checkout -b","git push"],c:2,ok:"Certo! git checkout -b cria e muda de uma vez.",err:"Errado. O comando correto e git checkout -b nome-da-branch."}
    ]
  },
  {
    id:4, title:"Clonando e colaborando", desc:"clone, fork e pull request", xp:40,
    teoria:[
      "Para baixar um projeto do GitHub para sua maquina use git clone URL. Isso cria uma copia completa com todo o historico.",
      "Fork e uma copia de um repositorio de outra pessoa para a sua conta no GitHub. Voce pode modificar livremente sem afetar o original.",
      "Depois de fazer mudancas no fork voce pode propor que o dono do projeto original aceite suas mudancas atraves de um Pull Request.",
      "Pull Request e a forma de colaborar em projetos open source. Voce sugere mudancas e o dono decide se aceita ou nao."
    ],
    cmds:["git clone https://github.com/usuario/repo.git","git log --oneline","git diff","git status"],
    resp:[
      "Cloning into 'repo'... done.",
      "a1b2c3d Adiciona funcionalidade X\n4e5f6g7 Corrige bug no login\n8h9i0j1 Primeiro commit",
      "diff --git a/index.html b/index.html - mudancas encontradas",
      "On branch main - your branch is up to date"
    ],
    quiz:[
      {q:"O que faz o git clone?",opts:["Cria uma branch","Apaga o repositorio local","Baixa uma copia completa do repositorio","Envia arquivos ao GitHub"],c:2,ok:"Certo! git clone baixa uma copia completa do projeto.",err:"Errado. git clone baixa uma copia completa do repositorio com todo o historico."},
      {q:"O que e um Pull Request?",opts:["Um comando do Git","Uma proposta de mudanca para o dono do projeto aceitar","Um tipo de branch","Um erro no codigo"],c:1,ok:"Certo! Pull Request e uma proposta de mudanca.",err:"Errado. Pull Request e uma proposta de mudanca que voce envia para o dono do projeto avaliar."}
    ]
  }
];

var conquistas = [
  {icon:"🚀", name:"Primeiro Passo", desc:"Completou a primeira aula"},
  {icon:"💾", name:"Commiteiro", desc:"Completou a aula de commits"},
  {icon:"☁️", name:"Na Nuvem", desc:"Conectou ao GitHub"},
  {icon:"🌿", name:"Brancheiro", desc:"Dominou as branches"},
  {icon:"🤝", name:"Colaborador", desc:"Completou o curso"}
];

var progresso = JSON.parse(localStorage.getItem('gitquest') || '{"xp":0,"nivel":1,"concluidas":[]}');
var aulaAtual = 0;
var quizIndex = 0;
var quizRespondido = false;

function salvar() {
  localStorage.setItem('gitquest', JSON.stringify(progresso));
}

function atualizarXP() {
  var xpNivel = progresso.nivel * 100;
  var xpAtual = progresso.xp % 100;
  document.getElementById('xpFill').style.width = (xpAtual) + '%';
  document.getElementById('xpText').textContent = xpAtual + ' / 100';
  document.getElementById('nivelLabel').textContent = 'Nivel ' + progresso.nivel;
  var total = LS.length;
  var feitas = progresso.concluidas.length;
  document.getElementById('progressText').textContent = feitas + ' de ' + total + ' aulas concluidas';
  document.getElementById('progressFill').style.width = (feitas / total * 100) + '%';
}

function renderTrail() {
  var container = document.getElementById('trailContainer');
  container.innerHTML = '';
  LS.forEach(function(aula, i) {
    var done = progresso.concluidas.indexOf(i) >= 0;
    var card = document.createElement('div');
    card.className = 'lesson-card' + (done ? ' completed' : '');
    card.innerHTML =
      '<div class="lesson-icon">' + (i+1) + '</div>' +
      '<div class="lesson-info"><h3>' + aula.title + '</h3><p>' + aula.desc + '</p></div>' +
      '<span class="lesson-badge ' + (done ? 'badge-done' : 'badge-free') + '">' + (done ? 'Feito' : '+'+aula.xp+' XP') + '</span>';
    card.onclick = function() { abrirAula(i); };
    container.appendChild(card);
  });
}

function renderConquistas() {
  var grid = document.getElementById('achievementsGrid');
  grid.innerHTML = '';
  conquistas.forEach(function(c, i) {
    var unlocked = progresso.concluidas.indexOf(i) >= 0;
    var div = document.createElement('div');
    div.className = 'achievement' + (unlocked ? ' unlocked' : '');
    div.innerHTML = '<div class="ach-icon">' + c.icon + '</div><div class="ach-name">' + c.name + '</div>';
    grid.appendChild(div);
  });
}

function abrirAula(i) {
  aulaAtual = i;
  quizIndex = 0;
  quizRespondido = false;
  var aula = LS[i];
  document.getElementById('modalTitle').textContent = aula.title;

  // TEORIA
  var teoria = '<div class="lesson-content">';
  aula.teoria.forEach(function(p) { teoria += '<p>' + p + '</p>'; });
  teoria += '<div class="tip-box">';
  aula.cmds.forEach(function(cmd) { teoria += '$ ' + cmd + '\n'; });
  teoria += '</div></div>';
  document.getElementById('tab-teoria').innerHTML = teoria;

  // TERMINAL
  var pratica = '<div class="terminal" id="terminal"><span class="info">Terminal simulado — digite os comandos abaixo</span></div>';
  pratica += '<div class="terminal-input-row"><span class="terminal-prompt">$</span><input class="terminal-input" id="termInput" placeholder="Digite um comando..." onkeydown="if(event.key===\'Enter\')rodarCmd()"/></div>';
  pratica += '<button class="btn-run" onclick="rodarCmd()">Executar</button>';
  pratica += '<button class="btn-clear" onclick="limparTerminal()">Limpar</button>';
  pratica += '<div class="cmds-lista"><p>Comandos desta aula:</p>';
  aula.cmds.forEach(function(cmd) { pratica += '<span>$ ' + cmd + '</span>'; });
  pratica += '</div>';
  document.getElementById('tab-pratica').innerHTML = pratica;

  // QUIZ
  renderQuiz();

  switchTab('teoria', document.querySelector('.tab'));
  document.getElementById('modalOverlay').classList.add('active');
}

function renderQuiz() {
  var aula = LS[aulaAtual];
  var q = aula.quiz[quizIndex];
  var html = '<p class="quiz-question">' + (quizIndex+1) + '. ' + q.q + '</p><div class="quiz-options">';
  q.opts.forEach(function(opt, i) {
    html += '<button class="quiz-option" onclick="responderQuiz(this,' + i + ')">' + opt + '</button>';
  });
  html += '</div>';
  html += '<div class="quiz-feedback" id="quizFeedback"></div>';
  html += '<button class="btn-next-quiz" id="btnNextQuiz" onclick="proximaQuiz()">Proxima pergunta</button>';
  document.getElementById('tab-quiz').innerHTML = html;
  quizRespondido = false;
}

function responderQuiz(btn, escolha) {
  if (quizRespondido) return;
  quizRespondido = true;
  var aula = LS[aulaAtual];
  var q = aula.quiz[quizIndex];
  var opts = document.querySelectorAll('.quiz-option');
  opts.forEach(function(b) { b.disabled = true; });
  var fb = document.getElementById('quizFeedback');
  if (escolha === q.c) {
    btn.classList.add('correct');
    fb.textContent = q.ok;
    fb.className = 'quiz-feedback show ok';
  } else {
    btn.classList.add('wrong');
    opts[q.c].classList.add('correct');
    fb.textContent = q.err;
    fb.className = 'quiz-feedback show err';
  }
  var btnNext = document.getElementById('btnNextQuiz');
  var isUltima = quizIndex >= aula.quiz.length - 1;
  btnNext.textContent = isUltima ? 'Concluir aula' : 'Proxima pergunta';
  btnNext.className = 'btn-next-quiz show';
}

function proximaQuiz() {
  var aula = LS[aulaAtual];
  if (quizIndex < aula.quiz.length - 1) {
    quizIndex++;
    renderQuiz();
  } else {
    concluirAula();
  }
}

function concluirAula() {
  var aula = LS[aulaAtual];
  if (progresso.concluidas.indexOf(aulaAtual) < 0) {
    progresso.concluidas.push(aulaAtual);
    progresso.xp += aula.xp;
    progresso.nivel = Math.floor(progresso.xp / 100) + 1;
    salvar();
    mostrarToast('+' + aula.xp + ' XP! Aula concluida!');
  }
  fecharModal();
  atualizarXP();
  renderTrail();
  renderConquistas();
}

function rodarCmd() {
  var input = document.getElementById('termInput');
  var cmd = input.value.trim();
  if (!cmd) return;
  var terminal = document.getElementById('terminal');
  var aula = LS[aulaAtual];
  var idx = aula.cmds.indexOf(cmd);
  var linha = '<span class="cmd">$ ' + cmd + '</span>';
  if (idx >= 0) {
    linha += '<span class="out">' + aula.resp[idx] + '</span>';
  } else {
    linha += '<span class="err">Comando nao reconhecido. Tente um dos comandos da lista.</span>';
  }
  terminal.innerHTML += linha;
  terminal.scrollTop = terminal.scrollHeight;
  input.value = '';
}

function limparTerminal() {
  var terminal = document.getElementById('terminal');
  if (terminal) terminal.innerHTML = '<span class="info">Terminal limpo.</span>';
}

function switchTab(nome, btn) {
  document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('tab-' + nome).classList.add('active');
  if (btn) btn.classList.add('active');
}

function fecharModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function mostrarToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

atualizarXP();
renderTrail();
renderConquistas();
</script>
</body>
</html>
